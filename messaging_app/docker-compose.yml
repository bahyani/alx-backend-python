# docker-compose.yml
version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: 'messaging_app_db'
    restart: always
    environment:
      MYSQL_DATABASE: 'messaging_app_db'
      MYSQL_USER: 'ikenna'
      MYSQL_PASSWORD: '1234'
      MYSQL_ROOT_PASSWORD: '1234'
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  web:
    build: .
    container_name: messaging_app_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG}
      - MYSQL_DB= 'messaging_app_db'
      - MYSQL_USER= 'ikenna'
      - MYSQL_PASSWORD= '1234'
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data: